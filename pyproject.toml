[build-system]
requires = ["uv_build>=0.7.10,<0.8.0"]
build-backend = "uv_build"

[project]
name = "reality-defender-slack-app"
version = "0.1.0"
description = "An app that integrates Slack with the Reality Defender platform."
authors = [
    { name = "Reality Defender", email = "support@realitydefender.ai" }
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["slack", "app", "deepfake", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiohttp>=3.10.0",
    "slack-bolt>=1.23.0",
    "pydantic>=2.11.4,<3.0.0",
    "pydantic-settings>=2.5.0",
    "realitydefender>=0.1.11"
]

[project.scripts]
rd-slack-app = "reality_defender_slack_app.__main__:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "httpx>=0.27.0",
    "ruff>=0.11.3",
    "mypy>=1.0.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "httpx>=0.27.0",
]

lint = [
    "ruff>=0.11.3",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/reality-defender/slack-app"
Repository = "https://github.com/reality-defender/slack-app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
markers = [
    "asyncio: mark a test as an asyncio coroutine"
]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
allow_redefinition = true

[[tool.mypy.overrides]]
module = ["slack_bolt.*", "slack_sdk.*", "aiohttp.*"]
ignore_missing_imports = true